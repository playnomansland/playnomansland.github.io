# No Mans Land game server. Deployed by .github/workflows/server-deploy.yml when CLOUDFLARE_API_TOKEN is set.
name = "nml-server"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Pages that may open a connection. Anything else is turned away.
[vars]
ALLOWED_ORIGINS = "https://snetendare.github.io,https://playnomansland.github.io,http://localhost:8766,http://127.0.0.1:8766,http://localhost:8787"
# Google sign-in (step 5): the public OAuth client id. The server checks that Google ID tokens were made for it.
GOOGLE_CLIENT_ID = "732949481177-ikom5gqq07pt0sg89km9mth5d9ibfvmi.apps.googleusercontent.com"
# Discord (2026-11-03): the BABABABA title for players in the game's Discord server (accounts.js DISCORD). Off until
# DISCORD_CLIENT_ID and DISCORD_GUILD_ID are set here and DISCORD_CLIENT_SECRET is a Cloudflare secret (the deploy
# workflow puts the GitHub secret of that name there). DISCORD_INVITE: the server's invite link, shown on the page.
DISCORD_CLIENT_ID = "1567300349285502978"
DISCORD_GUILD_ID = "1566427821184655380"
DISCORD_INVITE = "https://discord.gg/TBpDKSBWsY"
# Bug reports (2026-11-04, accounts.js BUG): BUG_WEBHOOK is a Cloudflare secret (a webhook on the #bug-reports forum; the
# deploy workflow copies the GitHub secret DISCORD_BUG_WEBHOOK). Optional BUG_TAG = "<forum tag id>" if the forum requires tags.

# One Room per match code. SQLite-backed, so it works on the Free plan.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# One TourRoom per tournament code: keeps the tournament, so it lives on when the organizer's phone closes.
[[durable_objects.bindings]]
name = "TOUR"
class_name = "TourRoom"

# 2v2 (developer test, 2026-11-02): one DuoRoom per 2v2 match code (two lanes, four seats; src/duo.js).
[[durable_objects.bindings]]
name = "DUO"
class_name = "DuoRoom"

# Match history (step 4): one HistoryRoom ('all') with its own SQLite keeps every round of every server match.
[[durable_objects.bindings]]
name = "HISTORY"
class_name = "HistoryRoom"

# The online lobby (2026-11-04, docs/LOBBY.md): one LobbyRoom ('all') lists the public rooms; the rooms report to it.
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyRoom"

# Friends (2026-11-04): one PlayerHub per player (named by the player id): online status, game invites, private messages.
[[durable_objects.bindings]]
name = "HUB"
class_name = "PlayerHub"

# Players online (2026-11-10): one OnlineRoom ('all') counts the open game pages; developers read the count (online.js).
[[durable_objects.bindings]]
name = "ONLINE"
class_name = "OnlineRoom"

# Accounts (step 5): the D1 database nml-accounts (on since 2026-11-02). Without this block /account/* answers 503
# 'accounts off' and nothing else changes. The tables are made by the Worker itself (accounts.js, ensureSchema).
# Developer mode: the secret DEV_EMAILS (set by the deploy workflow from the GitHub secret of the same name).
# test/accounts.test.js adds a local copy of this block by itself when it is still commented out.
[[d1_databases]]
binding = "ACCOUNTS"
database_name = "nml-accounts"
database_id = "fb6dc6c6-cec5-4b50-a7cc-2bb6142f586c"

# Hourly cron (UTC, at :07): month end, the gold Legend title for the leaderboard's top 5 (accounts.js awardLegends).
[triggers]
crons = ["7 * * * *"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TourRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["HistoryRoom"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["DuoRoom"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["LobbyRoom"]

# friends (2026-11-04), after the lobby's "v5"
[[migrations]]
tag = "hub-1"
new_sqlite_classes = ["PlayerHub"]

# players online (2026-11-10)
[[migrations]]
tag = "online-1"
new_sqlite_classes = ["OnlineRoom"]

[observability]
enabled = true
