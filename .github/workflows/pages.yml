# Publishes the site to GitHub Pages. Only the files listed in .github/site-files.txt are published (the pages
# and what they load); the source code, server, tools, docs and design files stay off the site, so they can't be
# downloaded from it.
# Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
# To publish something new, add it to .github/site-files.txt. Anything not listed there stays in the repo only.
name: Pages deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A push made while one is running waits; if several pile up, only the newest
# is published. A running deploy is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Copy only the files listed in .github/site-files.txt
        run: |
          grep -vE '^\s*(#|$)' .github/site-files.txt | sed 's/\s*$//' > "$RUNNER_TEMP/site-files"
          missing=0
          while read -r f; do [ -e "$f" ] || { echo "::error::.github/site-files.txt lists $f, which is not in the repo"; missing=1; }; done < "$RUNNER_TEMP/site-files"
          [ "$missing" = 0 ]
          mkdir _site
          xargs -d '\n' -a "$RUNNER_TEMP/site-files" cp -r --parents -t _site/
          echo "Site size: $(du -sh _site | cut -f1), $(find _site -type f | wc -l) files"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
